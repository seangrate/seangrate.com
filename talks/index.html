ius algebra (GMA) of a matroid is an algebra encoding the combinatorics of its lattice of flats. In 2016, Maeno and Numata showed that the GMA of a matroid is Gorenstein if and only if the matroid is modular. Joint with Jason McCullough, we show that modular matroids have Koszul GMAs by showing that their defining ideals have a quadratic Gr\u00f6bner basis, and we show that the GMAs of nearly all affine geometries are quadratic."}, "venue": "Upcoming Researchers in Commutative Algebra (URiCA)"}, {"title": "SVD is all you need", "year": 2026, "month": 5, "day": 7, "location": "Grinell College", "city": "Grinell, IA", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "Matrices have many factorizations which are amenable to certain applications, such as QR decomposition for least-squares problems. The singular value decomposition (SVD) is yet another factorization of a matrix, but which recovers other matrix factorizations and which has wide applicability to modern problems. I will talk about diagonalization of matrices, SVD, and showcase how these decompositions manifest in problems from computer vision and statistics."}, "venue": "Undergraduate Math Seminar"}, {"title": "Gorenstein graded M\u00f6bius algebras are Koszul", "year": 2026, "month": 4, "day": 18, "location": "North Dakota State University", "city": "Fargo, ND", "extras": {"notes": "", "code": "", "slides": "../misc/slides/ams-central-s26/talk.pdf", "video": "", "abstract": "The graded M\u00f6bius algebra of a matroid is an algebra encoding the combinatorics of the lattice of flats. In 2016, Maeno and Numata showed that the graded M\u00f6bius algebra of a matroid is Gorenstein if and only if the matroid is modular. We extend this result by showing that these algebras are also Koszul by showing that the defining ideals have a quadratic Gr\u00f6bner basis. We also examine the Koszul property for graded M\u00f6bius algebras of affine geometries, showing that those of finite affine planes are Koszul using a filtration argument. This is joint work with Jason McCullough."}, "venue": "AMS Spring Central Sectional Meeting"}, {"title": "Gorenstein graded M\u00f6bius algebras are Koszul", "year": 2026, "month": 4, "day": 3, "location": "Iowa State University", "city": "Ames, IA", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "The graded M\u00f6bius algebra of a matroid is an algebra encoding the combinatorics of the lattice of flats. In 2016, Maeno and Numata showed that the graded M\u00f6bius algebra of a matroid is Gorenstein if and only if the matroid is modular. We extend this result by showing that these algebras are also Koszul by showing that the defining ideals have a quadratic Gr\u00f6bner basis. We also examine the Koszul property for graded M\u00f6bius algebras of affine geometries, showing that those of finite affine planes are Koszul using a filtration argument. This is joint work with Jason McCullough."}, "venue": "Algebra and Geometry Seminar"}, {"title": "Betti tables forcing failure of the weak Lefschetz property", "year": 2025, "month": 11, "day": 11, "location": "Zoom", "city": "Virtual", "extras": {"notes": "", "code": "", "slides": "../misc/slides/stockholm/talk.pdf", "video": "", "abstract": "For most rings, a lot of the data of the ring can be captured via its (minimal) free resolution. This can then be summarized with a Betti table which, in some sense, describes the complexity of the ring. If such a ring is also Artinian, the ring is said to have the weak Lefschetz property (WLP) if multiplication by some linear form is always full rank. Although Lefschetz properties are of interest to algebraists, many combinatorialists like to leverage constructions of Artinian algebras with the WLP to prove results about, for instance, log-concavity of sequences. Joint with Hal Schenck, we show that if the Betti table of an Artinian algebra has a certain substructure resembling a Koszul complex, then the Artinian algebra cannot have the WLP."}, "venue": "Stockholm Commutative Algebra Seminar"}, {"title": "The stable Tamari lattice", "year": 2025, "month": 11, "day": 6, "location": "Iowa State University", "city": "Ames, IA", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "The stable Tamari lattice was introduced by Haiman through the lens of invariant polynomials, extended by Bergeron-Preville-Ratelle, and is a variation of the Tamari lattice. Stemming from the AMS MRC: Algebraic Combinatorics this past summer, I will describe some work in progress joint with Anna Pun, Herman Chau, Spencer Daugherty, and Juan Carlos Mart\u00ednez Mori where we describe the combinatorics of this lattice. Namely, I will present properties of the lower order ideals of this lattice, the cover relations, and some enumeration problems (related to Catalan numbers and parking functions) we are tackling. I will discuss this data through some examples and Python code."}, "venue": "Discrete Math Seminar"}, {"title": "Betti tables forcing failure of the weak Lefschetz property", "year": 2025, "month": 10, "day": 31, "location": "Iowa State University", "city": "Ames, IA", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "For most rings, a lot of the data of the ring can be captured via its (minimal) free resolution. This can then be summarized with a Betti table which, in some sense, describes the complexity of the ring. If such a ring is also Artinian, the ring is said to have the weak Lefschetz property (WLP) if multiplication by some linear form is always full rank. Although Lefschetz properties are of interest to algebraists, many combinatorialists like to leverage constructions of Artinian algebras with the WLP to prove results about, for instance, log-concavity of sequences. Joint with Hal Schenck, we show that if the Betti table of an Artinian algebra has a certain substructure resembling a Koszul complex, then the Artinian algebra cannot have the WLP."}, "venue": "Algebra and Geometry Seminar"}, {"title": "Combinatorial bounds on the Castelnuovo-Mumford regularity of toric surfaces", "year": 2025, "month": 10, "day": 19, "location": "St. Louis University", "city": "St. Louis, MO", "extras": {"notes": "", "code": "", "slides": "../misc/slides/ams-central-f25/regularity.pdf", "video": "", "abstract": "In 1996, L'vovsky showed the Castelnuovo-Mumford regularity of the coordinate ring of a monomial curve is bounded by the sum of its semigroup's two largest gaps. We explore analogous results for toric surfaces embedded by incomplete linear systems, and show that for certain classes the regularity is controlled by the combinatorics of the associated semigroup."}, "venue": "AMS Fall Central Sectional Meeting"}, {"title": "Combinatorial bounds on the Castelnuovo-Mumford regularity of toric surfaces", "year": 2025, "month": 7, "day": 23, "location": "University of Miami", "city": "Miami, FL", "extras": {"notes": "", "code": "", "slides": "../misc/slides/mca-2025/regularity.pdf", "video": "", "abstract": "In 1996, L'vovsky showed the Castelnuovo-Mumford regularity of the coordinate ring of a monomial curve is bounded by the sum of its semigroup's two largest gaps. We explore analogous results for toric surfaces embedded by incomplete linear systems, and show that for certain classes the regularity is controlled by the combinatorics of the associated semigroup."}, "venue": "Mathematical Congress of the Americas"}, {"title": "Problems in computational algebraic geometry: Lefschetz properties and toric varieties", "year": 2025, "month": 7, "day": 18, "location": "Zoom", "city": "Virtual", "extras": {"notes": "", "code": "", "slides": "../misc/thesis/presentation.html", "video": "", "abstract": ""}, "venue": "Thesis Defense"}, {"title": "Castelnuovo-Mumford regularity of toric surfaces", "year": 2025, "month": 7, "day": 8, "location": "University of Wisconsin-Madison", "city": "Madison, WI", "extras": {"notes": "", cation": "Seattle Convention Center", "city": "Seattle, WA", "extras": {"notes": "", "code": "", "slides": "../misc/slides/jmm/regularity.pdf", "video": "", "abstract": "In 1996, L'vovsky showed the Castelnuovo-Mumford regularity of the coordinate ring of a monomial curve is bounded by the sum of its semigroup's two largest gaps. We explore analogous results for toric surfaces embedded by incomplete linear systems, and show that for certain classes the regularity is controlled by the combinatorics of the associated semigroup, and is bounded by the area of the associated polygon."}, "venue": "Joint Mathematics Meetings"}, {"title": "The stable Tamari lattice", "year": 2024, "month": 11, "day": 6, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "The stable Tamari lattice was introduced by Haiman through the lens of invariant polynomials, extended by Bergeron-Preville-Ratelle, and is a variation of the Tamari lattice. Stemming from the AMS MRC: Algebraic Combinatorics this past summer, I will describe some work in progress joint with Anna Pun, Herman Chau, Spencer Daugherty, and Juan Carlos Mart\u00ednez Mori where we describe the combinatorics of this lattice. Namely, I will present properties of the lower order ideals of this lattice, the cover relations, and some enumeration problems we are tackling. I will discuss this data through some examples and Python code."}, "venue": "Discrete Math Seminar"}, {"title": "Betti tables forcing failure of the weak Lefschetz property", "year": 2024, "month": 10, "day": 16, "location": "University of Nebraska-Lincoln", "city": "Lincoln, NE", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "For most rings, a lot of the data of the ring can be captured via its (minimal) free resolution, in turn summarized by a Betti table. If such a ring is also Artinian, the ring is said to have the weak Lefschetz property (WLP) if multiplication by some linear form is always full rank. Joint with Hal Schenck, we show that if the Betti table of an Artinian algebra has a certain substructure resembling a Koszul complex, then the Artinian algebra cannot have the WLP."}, "venue": "Commutative Algebra Seminar"}, {"title": "Betti tables and Lefschetz properties", "year": 2024, "month": 10, "day": 16, "location": "University of Nebraska-Lincoln", "city": "Lincoln, NE", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "For most rings, a lot of the data of the ring can be captured via its (minimal) free resolution. This can then be summarized with a Betti table which, in some sense, describes the complexity of the ring. If such a ring is also Artinian, the ring is said to have the weak Lefschetz property (WLP) if multiplication by some linear form is always full rank. I will go through the background material necessary to be able to understand the follow-up talk in the Commutative Algebra Seminar."}, "venue": "Commutative Algebra Reading Seminar"}, {"title": "Betti numbers of connected sums of graded Artinian Gorenstein algebras", "year": 2024, "month": 10, "day": 9, "location": "Purdue University", "city": "West Lafayette, IN", "extras": {"notes": "", "code": "", "slides": "../misc/slides/connected-sums/purdue_presentation.html", "video": "", "abstract": "Considered as an algebraic analog for the connected sum construction from topology, the connected sum construction introduced by Ananthnarayan, Avramov, and Moore is a method to produce Gorenstein rings. Joint with Nasrin Altafi, Roberta Di Gennaro, Federico Galetto, Rosa M. Mir\u00f3-Roig, Uwe Nagel, Alexandra Seceleanu, and Junzo Watanabe, we determine the graded Betti numbers for connected sums and fiber products of Artinian Gorenstein algebras, where the fiber product in the local setting was obtained by Geller. We also show that the connected sum of doublings is the doubling of a fiber product ring. I will discuss these results through some examples and Macaulay2 code."}, "venue": "Commutative Algebra Seminar"}, {"title": "Betti tables and Lefschetz properties", "year": 2024, "month": 10, "day": 9, "location": "Purdue University", "city": "West Lafayette, IN", "extras": {"notes": "", "code": "", "slides": "../misc/slides/lefschetz/purdue_presentation.html", "video": "", "abstract": "For most rings, a lot of the data of the ring can be captured via its (minimal) free resolution. This can then be summarized with a Betti diagram which, in some sense, describes the complexity of the ring. If such a ring is also Artinian, the ring is said to have the weak Lefschetz property (WLP) if multiplication by some linear form is always full rank. Although Lefschetz properties are of interest to algebraists, many combinatorialists like to leverage constructions of Artinian algebras with the WLP to prove results about, for instance, log-concavity of sequences. Joint with Hal Schenck, we show that if the Betti table of an Artinian algebra has a certain substructure resembling a Koszul complex, then the Artinian algebra cannot have the WLP."}, "venue": "Student Commutative Algebra Seminar"}, {"title": "Castelnuovo-Mumford regularity of toric surfaces", "year": 2024, "month": 9, "day": 14, "location": "University of Texas, San Antonio", "city": "San Antonio, TX", "extras": {"notes": "", "code": "", "slides": "../misc/slides/ams-central-f24/presentation.html", "video": "", "abstract": "In 1996, L'vovsky showed the Castelnuovo-Mumford regularity of the coordinate ring of a monomial curve is bounded by the sum of its semigroup's two largest gaps. We explore analogous results for toric surfaces embedded by incomplete linear systems, and show that for certain classes the regularity is controlled by the combinatorics of the associated semigroup, and is bounded by the area of the associated polygon."}, "venue": "AMS Fall Central Sectional"}, {"title": "Betti numbers of connected sums of graded Artinian Gorenstein algebras", "year": 2024, "month": 9, "day": 10, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "", "code": "", "slides": "../misc/slides/connected-sums/auburn_presentation.html", "video": "", "abstract": "Considered as an algebraic analog for the connected sum construction from topology, the connected sum construction introduced by Ananthnarayan, Avramov, and Moore is a method to produce Gorenstein rings. Joint with Nasrin Altafi, Roberta Di Gennaro, Federico Galetto, Rosa M. Mir\u00f3-Roig, Uwe Nagel, Alexandra Seceleanu, and Junzo Watanabe, we determine the graded Betti numbers for connected sums and fiber products of Artinian Gorenstein algebras, where the fiber product in the local setting was obtained by Geller. We also show that the connected sum of doublings is the doubling of a fiber product ring. I will discuss these results through some examples and Macaulay2 code."}, "venue": "Algebra Seminar"}, {"title": "Bootstrapping Computations in Topological Data Analysis", "year": 2024, "month": 4, "day": 17, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "", "code": "", "slides": "../misc/slides/3M_thesis.pdf", "video": "", "abstract": ""}, "venue": "COSAM 3-Minute Thesis Competition"}, {"title": "Problems in computational algebraic geometry: Lefschetz properties and toric varieties", "year": 2024, "month": 3, "day": 26, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "", "code": "", "slides": "../misc/oral/presentation.html", "video": "", "abstract": "Starting with Lefschetz properties, moving on to toric varieties and Castelnuovo-Mumford regularity, and finishing with other miscellaneous projects, I will give an overview of the research I have conducted while at Auburn University. A common theme among all these projects is the strong presence (and necessity) of computation. As such, there will be many examples written in Macaulay2 and Python to help understand where these projects came from and how they were completed."}, "venue": "General Oral Exam"}, {"title": "Betti tables and Lefschetz properties", "year": 2024, "month": 2, "day": 13, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "For most rings, a lot of the data of the ring can be captured via its (minimal) free resolution. This can then be summarized with a Betti diagram which, in some sense, describes the complexity of the ring. If such a ring is also Artinian, the ring is said to have the weak Lefschetz property (WLP) if multiplication by some linear form is always full rank. Although Lefschetz properties are of interest to algebraists, many combinatorialists like to leverage constructions of Artinian algebras with the WLP to prove results about, for instance, log-concavity of sequences. Joint with Hal Schenck, we show that if the Betti table of an Artinian algebra has a certain substructure resembling a Koszul complex, then the Artinian algebra cannot have the WLP."}, "venue": "Algebra Seminar"}, {"title": "Suturing the severed didactic tetrahedron: Graph-Theoretic reflection to foster alignment in coordinated courses", "year": 2024, "month": 2, "day": 2, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "Despite online homework's growing prevalence as a uniform component in coordinated mathematics courses, few studies have considered the connection, or lack thereof, between instructors of record and fixed online homework sets. In this presentation we will share the results of a mixed-methods study examining how 10 university mathematics educators assessed the quality of a sampling of online Calculus I homework assignments. In the course of this project, we introduced our educators to a novel instrument called the Course Alignment Analysis Tool (CAAT), which leverages graph theory to assess the alignment between the learning outcomes that an instructor feels should be prioritized and the learning outcomes most emphasized by an assignment or assessment. In this highly interactive presentation, we will share both our results and walk you through using CAAT. For this reason, you have homework: Please bring a set of homework problems from an undergraduate course in your discipline! (If you're in the math department or happen to really enjoy calculus, we will have the Calculus I homework sets available for you to use)."}, "venue": "DBER (Discipline-Based Education Research) Seminar"}, {"title": "Betti tables forcing failure of the Weak Lefschetz Property", "year": 2024, "month": 1, "day": 26, "location": "Universit\u00e9 du Qu\u00e9bec \u00e0 Montr\u00e9al", "city": "Montr\u00e9al, QC", "extras": {"notes": "", "code": "", "slides": "../misc/slides/caac_wlp.pdf", "video": "", "abstract": "For most rings, a lot of the data of the ring can be captured via its (minimal) free resolution. This can then be summarized with a Betti diagram which, in some sense, describes the complexity of the ring. If such a ring is also Artinian, the ring is said to have the weak Lefschetz property (WLP) if multiplication by some linear form is always full rank. Although Lefschetz properties are of interest to algebraists, many combinatorialists like to leverage constructions of Artinian algebras with the WLP to prove results about, for instance, log-concavity of sequences. Joint with Hal Schenck, we show that if the Betti table of an Artinian algebra has a certain substructure resembling a Koszul complex, then the Artinian algebra cannot have the WLP."}, "venue": "Combinatorial Algebra Meets Algebraic Combinatorics (CAAC)"}, {"title": "Betti tables and Lefschetz properties", "year": 2023, "month": 11, "day": 15, "location": "University of Kentucky", "city": "Lexington, KY", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "For most rings, a lot of the data of the ring can be captured bles force the failure of the Weak Lefschetz Property (WLP); the corresponding Artinian algebras are typically not level, and the failure of WLP is not detected in terms of the Hilbert function."}, "venue": "Workshop on Lefschetz Properties in Algebra, Geometry, Topology and Combinatorics"}, {"title": "A brief introduction to tropical geometry", "year": 2022, "month": 8, "day": 31, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "../misc/notes/intro_tropical.pdf", "code": "", "slides": "", "video": "", "abstract": "The tropical semiring can be defined as the semiring over the extended real numbers where addition is defined by taking the maximum and multiplication is defined by classical addition. In this setting, there is a nice interplay between algebra and polyhedral geometry. In this talk, I plan on giving a brief introduction to some of the tropical analogs for results and ideas from classical algebraic geometry such as zeros of polynomials and Bezout's Theorem. These will mainly be explored through examples."}, "venue": "Graduate Student Seminar"}, {"title": "An overview of topological data analysis", "year": 2022, "month": 2, "day": 1, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "Tools from algebra and topology can be used to extract topological and geometric features of the data. The essence of topological data analysis (TDA) is to use a filtration on a finite point cloud to construct an algebraic complex modeling the data. The homology of this complex gives topological information about the data. Summaries of the topological information are shown through barcodes and persistence diagrams. This talk will give an overview of where TDA comes from, how it can be used, some examples, and potential research directions."}, "venue": "Math Club"}, {"title": "A brief introduction to tropical geometry", "year": 2021, "month": 11, "day": 2, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "../misc/notes/tropical.pdf", "code": "", "slides": "", "video": "", "abstract": "The tropical semiring can be defined as the semiring over the extended real numbers where addition is defined by taking the maximum and multiplication is defined by classical addition. In this setting, there is a nice interplay between algebra and polyhedral geometry. In this talk, I plan on giving a brief introduction to some of the tropical analogs for results and ideas from classical algebraic geometry such as zeros of polynomials and Bezout's Theorem. These will mainly be explored through examples."}, "venue": "Algebra Seminar"}, {"title": "Computations in topological data analysis", "year": 2021, "month": 8, "day": 3, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "", "code": "https://gist.github.com/seangrate/ab72aeeca5a7d98aa9d90655a90e6dfd", "slides": "", "video": "", "abstract": ""}, "venue": "Graduate Algebra Seminar"}, {"title": "Tropical algebra", "year": 2021, "month": 7, "day": 6, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": ""}, "venue": "Graduate Algebra Seminar"}, {"title": "Geometry in noncommutative algebra", "year": 2021, "month": 1, "day": 21, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "../misc/notes/heisenberg.pdf", "code": "", "slides": "", "video": "", "abstract": ""}, "venue": "First-Year Graduate Student Seminar"}, {"title": "What/Why/How of neural networks", "year": 2020, "month": 11, "day": 19, "location": "Auburn University", "city": "Auburn, AL", "extras": {"notes": "../misc/notes/neural_networks.pdf", "code": "https://gist.github.com/seangrate/080ab4da33be27924825a2b530754faa", "slides": "", "video": "", "abstract": ""}, "venue": "First-Year Graduate Student Seminar"}, {"title": "Lefschetz properties and Artinian rings", "year": 2020, "month": 6, "day": 1, "location": "McNeese State University", "city": "Lake Charles, LA", "extras": {"notes": "", "code": "", "slides": "", "video": "", "abstract": "Modules and rings are central topics of study in advanced algebra; in the special case where the ring is a field, a module is just a vector space. One much studied class of rings are Artinian quotients of polynomial rings over a field \\( k \\); Artinian means the ring itself is a finite dimensional vector space over \\( k \\). I'll discuss two interesting properties of Artinian rings\u2014the Lefschetz property (which is about the behavior of multiplication in the ring), and free resolutions, which come about from doing \"linear algebra with matrices of polynomials\"."}, "venue": "Math Seminar"}];
