institutions:
  - name: Iowa State University
    intro: >-
      I am a postdoc at Iowa State University.
      The covered material can be found <a href="https://catalog.iastate.edu/azcourses/math/" class="weblink" target="_blank">here</a>.
    courses:
      - term: Spring 2027
        description: Recitation leader for six sections of MATH 1660 Calculus II.
      - term: Fall 2026
        description: Instructor for large lecture of MATH 1500 Discrete Mathematics for Business and Social Sciences.
      - term: Spring 2026
        description: Instructor for two sections of MATH 2070 Matrices and Linear Algebra.
      - term: Fall 2025
        description: Recitation leader for six sections of MATH 1660 Calculus II.

  - name: Auburn University
    intro: >-
      I was a graduate teaching assistant (GTA) at Auburn University.
      Starting in Fall 2022, the department switched to almost all GTAs teaching recitations.
      The covered material can be found <a href="https://bulletin.auburn.edu/coursesofinstruction/math/" class="weblink" target="_blank">here</a>.
    courses:
      - term: Fall 2024
        description: Recitation leader for four sections of MATH 1620 Calculus II.
      - term: Spring 2024
        description: Recitation leader for two sections of MATH 1620 Calculus II.
      - term: Fall 2023
        description: Recitation leader for two sections of MATH 1610 Calculus I.
      - term: Spring 2023
        description: Recitation leader for two sections of MATH 1610 Calculus I.
      - term: Fall 2022
        description: Recitation leader for two sections of MATH 1610 Calculus I.
      - term: Spring 2022
        description: Instructor of record for one section of MATH 1610 Calculus I.
      - term: Fall 2021
        description: Instructor of record for two sections of MATH 1120 Pre-Calculus Algebra.

testimonial_groups:
  - heading: As a recitation leader for Calculus II
    quotes:
      - >-
        Sean Grate did great as a recitation leader.
        He made sure to explain everything in detail and helped me grasp concepts that were hard to understand in lecture.
        He covered all the bases as a recitation leader and I highly recommend him to anyone in the future.
      - >-
        Sean was a great TA, he worked out problems very well and encouraged cooperation with classmates in his recitation sessions.
        He also conducted sessions with tests and quizzes in mind and went out of his way to make sure we were ready for in class assessments.

  - heading: As a recitation leader for Calculus I
    quotes:
      - >-
        Sean was a fantastic recitation leader, he even held a lecture teaching 3.10, which was good as well.
        He was extremely supportive and honest when material became confusing or difficult, and never let his familiarity with these topics make us feel dumb.
        He would find many ways to explain one idea to help anybody grasp the hard topics.
      - >-
        Sean is a great ta. He is one of the few reasons I have not decided to drop this class.
        He actually cares to help you even though you may not have a great grasp on the material.
        He doesn't expect you to know everything perfectly.
        He has no problems with breaking down the problem in extra steps to provide clarity or staying after class to help me on questions I have.
        He is what I hope all of my future math TA's are.
      - >-
        Sean was GRATE!!
        Super helpful and very knowledgeable.
        He could answer any questions I had and explain things super simply.
        He was accommodating when I had to make up a quiz and always responded to emails quickly.
        I had experiences with a few of the recitation leaders, and he was by far my favorite.

  - heading: As instructor of record for Calculus I
    quotes:
      - >-
        Sean Grate is a fantastic teacher.
        His lessons are beneficial to learning in every way.
        He encourages learning in a multitude of different ways.
        He encourages frequent questions and working with our classmates.
        He encourages us to come speak to him during his office hours or after class if we have questions or need extra help.
        He creates a productive learning environment (to review for our last test, we had a review session outside), puts his personal time into our success as students (holds frequent review sessions before both quizzes and tests, creates multiple practice tests and quizzes to study with, and even holds these review sessions during his weekends), and is altogether a fun and kind teacher.
        He made an effort to learn each of our names, has conversations with us before class time, and asks us about our days.
        He remembered my major was architecture and how stressful it can be, and makes an effort to ask me specifically how it's going and if I'm able to manage everything efficiently.
        He is a fantastic teacher.
        Please give him a raise.
      - >-
        "Sean Grate is one of the best professors I have had at Auburn.
        I cannot say enough good things about him; he taught the material in a way that was easy to understand and apply on the tests and homework.
        I always looked forward to coming to class and feel that he provided a constructive learning environment.
        He has prepared me for future math courses and I would recommend him to anyone, were he to teach another class.
        I am very grateful for the effort he put into this class and willingness to help us perform to the best of our abilities.
        Also, throughout the course, he adjusted his teaching style according to our requests and what would help us succeed the most.
        Sean Grate truly went above and beyond for this class."
      - >-
        Mr. Grate was an excellent teacher who understands that Calculus 1 can be extremely difficult.
        He broke things down and explained things to best of his ability in the 50 minutes he was given.
        His office hours were helpful and was adamant on the homework policy. He was lenient and fair with pushing back homework due dates.
        Some areas of critique would be to slow down on some units.
        I remember earlier in the semester where he would fly by on some unit and left me (maybe others) in the dust.
        I believe he does this because of the amount of time he is given and there's a lot of material to be covered.
        Taking his class with no prior experience in calculus was honestly one of the best decisions I have ever made.
      - >-
        Mr. Grate was immensely helpful during the entirety of the course.
        He held review sessions before quizzes and exams and was always available during office hours and even outside of office hours.
        He consistently showed his concern for everyone's learning and was always happy to work with students individually to assist them however he could.
        Most importantly to me, he instilled a sense of pride in my own Math ability that had been previously lost in me.
        Mr. Grate was far and away the best Math professor I've ever had and one of the best professors I've had, period.
        My own experience in the class was second to none, so I cannot speak on areas of weakness.
        His teaching style fit my learning style very well and his unending support helped get me through the semester.
        Bless this man!
      - >-
        I cannot say enough good about Sean Grate.
        He is a very intelligent, compassionate instructor that finds math beautiful and tries to instill that same passion in his students.
        Sometimes I find his instructions to be confusing as he is so smart, sometimes he glosses over parts of a problem that would aid my understanding.
        However, should this happen I feel welcome to raise my hand and ask a question in class or go to office hours to discuss such things one-on-one.
        Otherwise, I have seen Sean's instruction style improve actively throughout the semester, showing that he actively tries to mold his instruction according to our needs.
        Also his compassion has shown through in the ways he works with us during class time, and how he grades our quizzes/tests so quickly and provides accurate feedback.
        Only thing he could improve on is bringing his classes handmade calzones.

  - heading: As instructor of record for Pre-Calculus Algebra
    quotes:
      - >-
        Mr. Grate was a very good professor for this course.
        He was easy to understand and always took time to make sure we were following him.
        Mr. Grate kept his class very well organized and timely.
        He cared a lot about our success and was always understanding if we were confused.
        I was easily able to get help during his office hours, and he even went into his lunch to make sure I was ready for the test.
        I would recommend him to anyone who wants to learn and be successful in this course.
        Thanks Mr. Grate!
        You're the best.
      - >-
        Great and clear grading criteria.
        Positive reinforcement with grading.
        Very helpful and accessible when make up work is needed due to an absence.
        Communicates well with the class.
        Very great class this semester :)
