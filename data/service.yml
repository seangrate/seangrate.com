- title: Department Tea (Auburn University)
  dates: 2021, 2023-present
  bullets:
    - Reorganized the department tea, a weekly gathering for graduate students, faculty, and staff to casually talk over tea, coffee, and snacks.
    - >-
      With the help of Joanie Morris, took over the responsibilities starting in 2023 by sending weekly reminders,
      buying supplies, tracking expenses, and setting up the venue.

- title: President of the Mathematics Club at Auburn University
  dates: 2021-2024
  bullets:
    - Rewrote constitution and bylaws to reinstate club as a recognized entity by Auburn University.
    - Recruited leadership and members for the club, and sent out emails to members about club meetings, outreach opportunities, and other relevant events.
    - Secured funding for club meetings.
    - Coordinated internal and external speakers from academia and industry to speak at club meetings.
    - Organized seminars, socials, and board game nights for the club.

- title: Secretary for the Auburn University DMS Graduate Student Council
  dates: 2022-2023
  bullets:
    - Maintained minutes for town halls.
    - Communicated with graduate students on the happenings of town halls.

- title: Graduate Student Representative on the Auburn University DMS Graduate Student Council
  dates: 2021-2023
  bullets:
    - Acted as a voice for my cohort at town halls and with the department in any issues or suggestions they raised.
    - Offered support and sought answers for questions fellow graduate students asked me.
    - Constructed cubicles for my cohort to ensure they had offices for the following semester.
    - Helped organize and set up department tailgates for football games.
    - Advocated for transparency in GTA assignments, including developing and implenting a potential, mathematically-based algorithm for doing so.
    - >-
      With the help of <a class="weblink" href="https://www.hailegilroy.com/" target="_blank">Haile Gilroy</a>, revamped the graduate student seminar
      to incentive first-year graduate students to attend a broad range of department seminars while simultaneously not overloading their schedules.
