- title: Destination STEM
  dates: October 2022, October 2023
  bullets:
    - >-
      An annual event hosted at Auburn University for younger students to explore STEM by completeing a "passport" of the sciences,
      collecting stamps as they go to each STEM field and participate at each exhibit.
    - Helped run a table on cryptography where students encrypted their own message and decrypted a message left by a previous visitor.
    - Ran a table on polyhedral subdivisions where students tried to reconstruct a shape from 3D-printed pieces that I designed.

