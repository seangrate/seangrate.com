- title: Combinatorial bounds on the Castelnuovo-Mumford regularity of toric surfaces
  date: 2025-10-19
  venue: AMS Fall Central Sectional Meeting
  location: St. Louis University
  city: St. Louis, MO
  category: conference
  slides: misc/slides/ams-central-f25/regularity.pdf
  abstract: |-
    In 1996, L'vovsky showed the Castelnuovo-Mumford regularity of the coordinate ring of a monomial curve is bounded by the sum of its semigroup's two largest gaps. We explore analogous results for toric surfaces embedded by incomplete linear systems, and show that for certain classes the regularity is controlled by the combinatorics of the associated semigroup.
