- title: The graded Möbius algebra of a matroid
  date: 2026-08-29
  venue: Upcoming Researchers in Commutative Algebra (URiCA)
  location: University of Nebraska-Lincoln
  city: Lincoln, NE
  category: conference
  slides: misc/slides/urica/gmas.pdf
  abstract: |-
    The graded Möbius algebra (GMA) of a matroid is an algebra encoding the combinatorics of its lattice of flats. In 2016, Maeno and Numata showed that the GMA of a matroid is Gorenstein if and only if the matroid is modular. Joint with Jason McCullough, we show that modular matroids have Koszul GMAs by showing that their defining ideals have a quadratic Gröbner basis, and we show that the GMAs of nearly all affine geometries are quadratic.
- title: SVD is all you need
  date: 2026-05-07
  venue: Undergraduate Math Seminar
  location: Grinell College
  city: Grinell, IA
  category: seminar
  abstract: |-
    Matrices have many factorizations which are amenable to certain applications, such as QR decomposition for least-squares problems. The singular value decomposition (SVD) is yet another factorization of a matrix, but which recovers other matrix factorizations and which has wide applicability to modern problems. I will talk about diagonalization of matrices, SVD, and showcase how these decompositions manifest in problems from computer vision and statistics.
- title: Gorenstein graded Möbius algebras are Koszul
  date: 2026-04-18
  venue: AMS Spring Central Sectional Meeting
  location: North Dakota State University
  city: Fargo, ND
  category: conference
  slides: misc/slides/ams-central-s26/talk.pdf
  abstract: |-
    The graded Möbius algebra of a matroid is an algebra encoding the combinatorics of the lattice of flats. In 2016, Maeno and Numata showed that the graded Möbius algebra of a matroid is Gorenstein if and only if the matroid is modular. We extend this result by showing that these algebras are also Koszul by showing that the defining ideals have a quadratic Gröbner basis. We also examine the Koszul property for graded Möbius algebras of affine geometries, showing that those of finite affine planes are Koszul using a filtration argument. This is joint work with Jason McCullough.
